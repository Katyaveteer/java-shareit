version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: shareit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  shareit-server:
    build: ./server
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shareit
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "9090:9090"

  shareit-gateway:
    build: ./gateway
    depends_on:
      - shareit-server
    environment:
      SHAREIT_SERVER_URL: http://shareit-server:9090
    ports:
      - "8080:8080"

volumes:
  postgres-data:
